<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Password strength checker with privacy-preserving breach detection.">
    <title>Hashlight</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Hashlight Cyber-Glass Container -->
<main class="hashlight-card">
  <!-- Header -->
  <header class="card-header">
    <div class="brand-badge" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
    </div>
    <h1 class="card-title">
      <span class="title-glow">Hashlight</span>
    </h1>
    <p class="card-subtitle">Password &amp; Breach Scanner</p>
  </header>

  <!-- Input Field Group -->
  <section class="input-group">
    <div class="input-label-row">
      <label for="password-input">Enter Secret Key</label>
    </div>
    <div class="input-wrapper">
      <input 
        id="password-input" 
        type="password" 
        class="password-input" 
        placeholder="Type or paste your password..." 
        autocomplete="off" 
        spellcheck="false"
      />
      <button 
        type="button" 
        id="toggle-visibility-btn" 
        class="toggle-btn" 
        aria-label="Toggle password visibility" 
        title="Show/Hide Password"
      >
        <!-- Eye Icon (👁️) -->
        <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>
  </section>

  <!-- Live Strength Meter -->
  <section class="meter-container" aria-live="polite">
    <div class="meter-header">
      <span class="meter-title">Password Strength</span>
      <!-- Dynamic classes: .weak, .medium, .strong -->
      <span id="meter-status" class="meter-status">Awaiting Input</span>
    </div>
    <div class="meter-track">
      <!-- Width & class updated dynamically via JS: 33% (.weak), 66% (.medium), 100% (.strong) -->
      <div id="meter-bar" class="meter-bar"></div>
    </div>
  </section>

  <!-- Requirements Checklist -->
  <section class="checklist-container">
    <h2 class="checklist-title">Security Checklist</h2>
    <ul class="checklist">
      <!-- Add class .valid to .checklist-item when condition is met -->
      <li class="checklist-item" id="req-length">
        <span class="indicator-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </span>
        <span>At least 8 characters</span>
      </li>
      <li class="checklist-item" id="req-uppercase">
        <span class="indicator-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </span>
        <span>At least one uppercase letter (A-Z)</span>
      </li>
      <li class="checklist-item" id="req-lowercase">
        <span class="indicator-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </span>
        <span>At least one lowercase letter (a-z)</span>
      </li>
      <li class="checklist-item" id="req-numbers">
        <span class="indicator-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </span>
        <span>At least one number (0-9)</span>
      </li>
      <li class="checklist-item" id="req-symbols">
        <span class="indicator-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </span>
        <span>At least one special symbol (!@#$%^&*)</span>
      </li>
    </ul>
  </section>

  <!-- Breach Check Section -->
  <footer class="breach-section">
    <button type="button" id="breach-check-btn" class="breach-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <span>Scan for Known Breaches</span>
    </button>
    <!-- Dynamic Feedback Alert Container (Hidden by default or populated via JS) -->
    <div id="breach-alert" class="breach-alert info" style="display: none;"></div>
  </footer>
</main>
    
    <script type="module" src="js/main.js"></script>
</body>
</html>
